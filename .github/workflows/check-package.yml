name: test-package
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run-test-that:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libgeos-dev

      - name: Install pinned Shiny
        run: |
          R -q -e 'install.packages("remotes", repos = "https://cloud.r-project.org")'
          R -q -e 'remotes::install_version("shiny", version = "1.13.0", repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            shiny@1.13.0
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'